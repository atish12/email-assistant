services:
  email-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: email-assistant
    ports:
      - "8501:8501"
    env_file:
      - .env                        # create this from .env.example
    volumes:
      - email_memory:/app/src/memory   # user_profiles.json
      - email_data:/app/data           # drafts_log.json + tone_samples
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  email_memory:
  email_data:
