[project]
name = "email-assistant"
version = "0.1.0"
description = "AI-powered email drafting assistant"
authors = [
    {name = "atish"}
]
readme = "README.md"
requires-python = "^3.11"
dependencies = [
    "anthropic (>=0.86.0,<0.87.0)",
    "langgraph (>=1.1.3,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "streamlit (>=1.55.0,<2.0.0)",
    "fpdf2 (>=2.7.0,<3.0.0)"
]


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)"
]
